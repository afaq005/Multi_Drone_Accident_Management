name: mdam

channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults

dependencies:
  - python=3.10
  - pip
  - numpy>=1.24
  - scipy>=1.11
  - pillow>=10.0
  - pytorch>=2.1
  - pytorch-cuda=12.1

  - pip:
      - opencv-python>=4.8
      - ultralytics==8.3.50
      - transformers>=4.40
      - accelerate>=0.30
      - openai==1.84.0
      - piper-tts>=1.2
      - paho-mqtt>=1.6
      - roboflow>=1.1
      - pytest>=8.0
